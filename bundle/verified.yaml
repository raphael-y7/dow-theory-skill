- capability_id: cap.dow-theory-skill.secondary-reaction-assessment-skill
  revision: 1
  status: active
  slug: secondary-reaction-assessment-skill
  title: 次级运动识别与幅度评估（33%~66%＋速度不对称＋完成序列）
  importance: critical
  importance_rationale: 承载 task-02（BOOK_OVERVIEW 排序第 2）；次级运动"最具欺骗性"（第 10 章）， 误把次级当反转是亏损主因；1926 年汉密尔顿错误为全书头号反面判例（第
    5 章整章复盘）。
  one_liner: 判定当前反向运动是次级运动还是趋势反转：3 周至数月、通常回撤前一主要运动的 33%~66% （区间极宽）、速度快于主要运动；牛市回调完成须四条件量价序列齐备； 回撤超 85%
    或双指数破位则疑似反转，按趋势程序确认。
