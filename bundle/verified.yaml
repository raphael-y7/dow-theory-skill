book:
  title: 道氏理论（专业解读版）THE DOW THEORY
  author: 【美】罗伯特·雷亚（Robert Rhea）著，谢飞译（理论主体为雷亚对道与汉密尔顿思想的整理）
  source_pack: 道氏理论（专业解读版）_合并转写稿.md
  baseline_tag: dow-theory-1932-rhea-cn-2015-professional
  overview: book/overview.md
  glossary: book/glossary.md
entry:
  name: dow-theory-skill
  description: 道氏理论（专业解读版）单入口：仅凭两种平均价格指数的市场行为（三种运动、相互确认、 线态窄幅盘整、量价关系、牛熊三阶段等规则）判断股市主要趋势方向与转折，辅助 A 股投资分析。
    本入口承接整书语境：三大前提（指数反映一切、主要运动不可操纵、道氏理论并非真理）、 十二项读者任务的路由与能力卡导读。
  core_principles:
  - 平均价格指数反映一切（不可抗力除外）——不接受此前提者不应使用本体系
  - 两种指数必须相互确认；未被确认的新高新低几乎是假象
  - 市场同时存在主要运动、次级运动与日间波动，判读前先锁定运动层级
  - 主要运动绝不可被人为操纵；日间波动很可能受操纵、次级运动所受影响有限
  - 道氏理论是实践科学而非不败体系；方向可判、持续时间不可预测
  out_of_scope:
  - 日内与短线交易信号（道氏理论时间尺度为主要趋势层级）
  - 个股买卖点位推荐与个股相对强度系统（指数不指导个股）
  - 精确逃顶/抄底点位预测（只有信号分级与统计预期）
  - 经济预测宏大叙事与 1903-1929 历史时评（作为 Boundary 与案例背景保留）
  - 预测次日或短期涨跌（"明天涨还是跌"类问题超出晴雨表分辨率，一律不受理）
  stop_conditions:
  - 信号矛盾或不可读，输出空仓观望直至信号清晰
  - 单指数未确认，按"等待确认/假象"处理，不入场也不反向
  - 统计分布（33%~66%、40%~60% 等）仅作预期校准，不得当作买卖触发器
  - 3%/5% 等阈值为讨论单位而非交易阈值，高位须按点位百分比放宽
router_entry:
  name: dow-theory-skill-router
  description: 道氏理论（专业解读版）来源路由入口：当用户请求属于本书知识但未命中任何晋级 Skill 时由此进入。 手持 6 张 router 能力卡——量价关系健康度评估、牛熊三阶段定位、个股操作大盘前置检查、
    预测自检训练法、次级反应统计基准与数据基建、伪信号与归因排查——并可将请求转交 7 个晋级能力（主要趋势判定、双指数确认过滤、次级运动评估、线态盘整判读、 熊市底部核查、顶部信号与清仓、交易纪律原则包）。
