    description: 判定反向运动是次级运动还是趋势反转并评估其幅度：次级运动持续3周至数月、通常回撤前一主要运动的33%~66%（分布极宽，仅作统计预期）、速度快于主要运动（牛市不以剧烈反弹开始、熊市反弹猛烈短促）；牛市回调完成须四条件量价序列（低点巨量→一两日反弹→再跌不破前低→下跌量缩）；回撤超85%或双指数破位→疑似反转，转趋势判定程序确认；真恐慌后约收复40%~60%再二次缓跌、摆动递减收敛。当用户问"回调还是反转/secondary
